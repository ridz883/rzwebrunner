<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Fullstack Runner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .tab-content { display: none; height: calc(100vh - 120px); }
    .tab-content.active { display: flex; }
    textarea { font-family: monospace; resize: none; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Header & Control Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <h1 class="font-bold text-sm tracking-wide text-indigo-400">RUNNER<span class="text-white">BOX</span></h1>
    <div class="flex items-center gap-2">
      <button id="btn-run" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2 rounded shadow transition">
        ▶ Run Project
      </button>
    </div>
  </header>

  <!-- Mobile Tab Navigation -->
  <nav class="flex border-b border-slate-800 bg-slate-900/50 text-xs">
    <button class="tab-btn flex-1 py-2.5 text-center font-medium text-indigo-400 border-b-2 border-indigo-500" data-tab="tab-files">Files</button>
    <button class="tab-btn flex-1 py-2.5 text-center font-medium text-slate-400 border-b-2 border-transparent" data-tab="tab-editor">Editor (<span id="active-file-label">None</span>)</button>
    <button class="tab-btn flex-1 py-2.5 text-center font-medium text-slate-400 border-b-2 border-transparent" data-tab="tab-preview">Preview & Log</button>
  </nav>

  <!-- Main Container -->
  <main class="flex-1 overflow-hidden relative">
    
    <!-- TAB 1: FILE EXPLORER -->
    <section id="tab-files" class="tab-content active flex-col p-4 overflow-y-auto">
      <div class="flex gap-2 mb-4">
        <input id="new-filename-input" type="text" placeholder="Nama file (contoh: routes.js)" class="flex-1 bg-slate-800 border border-slate-700 text-xs px-3 py-2 rounded focus:outline-none focus:border-indigo-500 text-white" />
        <button id="btn-add-file" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-2 rounded font-medium text-white">+ Tambah</button>
      </div>
      <div class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">Daftar File Project</div>
      <ul id="file-list" class="space-y-1.5 flex-1"></ul>
    </section>

    <!-- TAB 2: CODE EDITOR -->
    <section id="tab-editor" class="tab-content flex-col h-full">
      <textarea id="code-editor" class="w-full h-full bg-slate-950 text-slate-100 p-4 text-xs leading-relaxed outline-none border-none" placeholder="Pilih file dari tab Files untuk mulai mengedit..."></textarea>
    </section>

    <!-- TAB 3: PREVIEW & CONSOLE LOG -->
    <section id="tab-preview" class="tab-content flex-col h-full bg-slate-900">
      <!-- Preview Frame -->
      <div class="flex-1 bg-white relative">
        <div id="preview-placeholder" class="absolute inset-0 flex items-center justify-center text-slate-500 text-xs p-4 text-center">
          Klik tombol "Run Project" untuk memuat hasil web.
        </div>
        <iframe id="preview-frame" class="w-full h-full border-none hidden"></iframe>
      </div>
      <!-- Terminal Mini Log -->
      <div class="h-36 bg-black border-t border-slate-800 p-2 flex flex-col font-mono text-[11px]">
        <div class="text-slate-500 font-semibold mb-1">Terminal Output:</div>
        <pre id="terminal-output" class="flex-1 overflow-y-auto text-emerald-400 whitespace-pre-wrap">Menunggu instruksi...</pre>
      </div>
    </section>

  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
