<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RunnerBox IDE</title>
  <style>
    :root {
      --primary: #7c5cfc;
      --primary-hover: #6a48f3;
      --primary-light: #ede7ff;
      --accent: #5e3df5;
      --bg: #f8f9fd;
      --surface: #ffffff;
      --surface-subtle: #f1f3f9;
      --text: #1e1e2e;
      --text-muted: #8e8ea0;
      --border: #e2e4ed;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: "SF Mono", "Fira Code", Consolas, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      z-index: 20;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
    }

    .repo-title-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
    }

    .repo-user {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .repo-slash {
      color: var(--border);
      font-size: 11px;
    }

    #repo-name-input {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      border: none;
      background: transparent;
      outline: none;
      width: 110px;
    }

    .btn-run {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(124, 92, 252, 0.25);
    }

    .btn-run:disabled { opacity: 0.6; }

    /* Content Area */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-pane {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Tab 1: File Manager */
    .files-wrapper {
      padding: 16px;
      overflow-y: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .create-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .create-card input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      outline: none;
      background: var(--surface-subtle);
    }

    .create-card input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .create-card button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .file-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .file-item.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .file-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--primary);
    }

    .file-item.active .file-badge {
      background: #fff;
    }

    .file-path {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-folder-prefix {
      color: var(--text-muted);
      font-weight: 400;
    }

    .file-del {
      border: none;
      background: var(--danger-light);
      color: var(--danger);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tab 2: Editor */
    .editor-wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #181824;
    }

    .editor-header {
      background: #13131c;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #232333;
    }

    .active-file-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--primary-light);
      background: rgba(124, 92, 252, 0.2);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: var(--mono);
    }

    .editor-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .line-numbers {
      width: 36px;
      background: #14141d;
      color: #4b4b60;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 20px;
      padding: 12px 2px;
      text-align: right;
      user-select: none;
      overflow: hidden;
      border-right: 1px solid #212130;
    }

    #code-editor {
      flex: 1;
      height: 100%;
      background: transparent;
      color: #f1f3f9;
      border: none;
      outline: none;
      padding: 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 20px;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }

    /* Tab 3: Preview */
    .preview-wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .frame-container {
      flex: 1;
      background: white;
      position: relative;
    }

    #preview-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    .preview-idle {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      background: var(--bg);
    }

    .preview-idle-icon {
      width: 48px;
      height: 48px;
      background: var(--primary-light);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 20px;
      margin-bottom: 10px;
    }

    .terminal-box {
      height: 130px;
      background: #12121a;
      border-top: 1px solid #252535;
      display: flex;
      flex-direction: column;
      font-family: var(--mono);
      font-size: 10px;
    }

    .terminal-header {
      background: #0d0d14;
      padding: 5px 12px;
      font-weight: 600;
      color: #6d6d84;
    }

    #terminal-output {
      flex: 1;
      padding: 8px 12px;
      overflow-y: auto;
      color: #10b981;
      white-space: pre-wrap;
      line-height: 16px;
    }

    /* Bottom App Navigation */
    nav.bottom-nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
    }

    .nav-item {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 10px;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-light);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-group">
      <div class="brand-icon">⚡</div>
      <div class="repo-title-box">
        <span class="repo-user">workspace</span>
        <span class="repo-slash">/</span>
        <input id="repo-name-input" type="text" value="my-backend-app" spellcheck="false" />
      </div>
    </div>
    <button id="btn-run" class="btn-run">
      <span>▶</span> Run
    </button>
  </header>

  <!-- Main View -->
  <main>
    
    <!-- Tab 1: Files -->
    <section id="pane-files" class="tab-pane active">
      <div class="files-wrapper">
        <div class="create-card">
          <input id="input-filename" type="text" placeholder="Buat file atau folder (misal: api/server.js)" />
          <button id="btn-create-file">+ Buat</button>
        </div>

        <div class="section-title">Daftar Struktur Project</div>
        <ul id="file-list" class="file-grid"></ul>
      </div>
    </section>

    <!-- Tab 2: Editor -->
    <section id="pane-editor" class="tab-pane">
      <div class="editor-wrapper">
        <div class="editor-header">
          <span class="active-file-tag" id="label-active-file">server.js</span>
          <span style="color: #64748b; font-size: 11px;">Tersimpan</span>
        </div>
        <div class="editor-body">
          <div class="line-numbers" id="line-numbers">1</div>
          <textarea id="code-editor" spellcheck="false" placeholder="Tulis kodinganmu..."></textarea>
        </div>
      </div>
    </section>

    <!-- Tab 3: Preview -->
    <section id="pane-preview" class="tab-pane">
      <div class="preview-wrapper">
        <div class="frame-container">
          <div id="preview-idle" class="preview-idle">
            <div class="preview-idle-icon">🚀</div>
            <p>Klik tombol <strong>Run</strong> untuk melihat hasil project secara langsung.</p>
          </div>
          <iframe id="preview-frame" style="display: none;"></iframe>
        </div>

        <div class="terminal-box">
          <div class="terminal-header">Terminal Server</div>
          <pre id="terminal-output">Menunggu run...</pre>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-target="pane-files">
      <svg viewBox="0 0 24 24"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      <span>Files</span>
    </button>
    <button class="nav-item" data-target="pane-editor">
      <svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>
      <span>Editor</span>
    </button>
    <button class="nav-item" data-target="pane-preview">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
      <span>Preview</span>
    </button>
  </nav>

  <script type="module" src="./app.js"></script>
</body>
</html>
